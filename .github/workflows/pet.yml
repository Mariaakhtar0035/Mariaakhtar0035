name: YourTomo cat
on:
  schedule:
    - cron: '23 */6 * * *'   # every 6h
  workflow_dispatch:
 
permissions:
  contents: write
 
concurrency:
  group: profile-commits   # shared with bonsai.yml so the two never push at once
  cancel-in-progress: false
 
jobs:
  pet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prsdx/github-pet@v1
        with:
          timezone-offset-minutes: "-240"   # Toronto (EDT); use "-300" after clocks go back in November
